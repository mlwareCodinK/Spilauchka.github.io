<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скачать видео DPlayer</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #14161a; color: #e8e8e8; }
  h1 { font-size: 1.4rem; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3f48; background: #1d2026; color: inherit; }
  input[type=text] { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=number] { width: 90px; }
  button { background: #3b82f6; border-color: #3b82f6; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: #0d0f12; padding: 12px; border-radius: 8px; min-height: 120px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: .85rem; }
  .err { color: #f87171; } a.dl { display: inline-block; margin-top: 10px; color: #4ade80; font-weight: 600; }
</style>
</head>
<body>
<h1>Скачать видео с DPlayer</h1>
<input id="url" type="text" placeholder="Вставь ссылку на страницу с видео" autofocus>
<div class="row">
  <label>Ждать буферизацию, сек: <input id="wait" type="number" value="60" min="5" max="600"></label>
  <button id="go">Скачать</button>
</div>
<p style="font-size:.85rem;color:#9aa0aa">Страница открывается в чистом браузере без куки, видео играет ~минуту, затем ссылка на файл перехватывается и видео скачивается.</p>
<pre id="log"></pre>
<div id="result"></div>
<script>
const $ = (id) => document.getElementById(id);
$('go').onclick = async () => {
  $('go').disabled = true; $('log').textContent = ''; $('result').innerHTML = '';
  const r = await fetch('/api/start', { method: 'POST', body: JSON.stringify({ url: $('url').value.trim(), wait: $('wait').value }) });
  const j = await r.json();
  if (!r.ok) { $('log').innerHTML = '<span class="err">' + j.error + '</span>'; $('go').disabled = false; return; }
  const timer = setInterval(async () => {
    const s = await (await fetch('/api/status/' + j.id)).json();
    let text = s.logs.join('\n');
    if (s.progress && s.progress.total) text += `\n${(s.progress.done / 1048576).toFixed(1)} / ${(s.progress.total / 1048576).toFixed(1)} МБ`;
    $('log').textContent = text; $('log').scrollTop = 1e9;
    if (s.status === 'done') {
      clearInterval(timer); $('go').disabled = false;
      $('result').innerHTML = '<a class="dl" href="/api/file/' + j.id + '">⬇ Сохранить ' + s.name.replace(/</g, '&lt;') + '</a>';
    } else if (s.status === 'error') {
      clearInterval(timer); $('go').disabled = false;
      $('log').innerHTML += '\n<span class="err">Ошибка: ' + s.error.replace(/</g, '&lt;') + '</span>';
    }
  }, 1000);
};
</script>
</body>
</html>
